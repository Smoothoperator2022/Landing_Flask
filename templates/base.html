<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>W.A. AI™ — Демонстрація</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{
      /* координати головної кнопки */
      --cta-left: 50%;
      --cta-top: 17%;

      /* тема */
      --bg:#0b0f14; --text:#e8eaee; --muted:#aab2bd; --accent:#d6b154; --accent-2:#c9a13f;
      --card:#121821; --ring:rgba(214,177,84,.35); --error:#ffb3b3; --okbg:#10331b; --okbr:#2d6a3b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,'Helvetica Neue',Arial,'Noto Sans';display:flex;min-height:100vh;flex-direction:column}
    .wrap{flex:1 0 auto}
    .container{max-width:1100px;margin:0 auto;padding:24px;width:100%}
    .hero{text-align:center;padding:4vh 0 6vh}

    /* Рамка + зображення */
    .hero-frame{position:relative;border-radius:16px;border:1px solid rgba(255,255,255,.06);overflow:hidden;max-width:1100px;margin:0 auto;background:#0b0f14}
    .hero-img{display:block;width:100%;height:auto;vertical-align:middle}

    /* Кнопки поверх */
    .cta-spot{position:absolute;left:var(--cta-left);top:var(--cta-top);transform:translate(-50%,-50%);z-index:2}
    /* друга й третя кнопка: координати за замовчуванням для ДЕСКТОПУ */
    .cta-spot2{left:50%; top:55%}
    .cta-spot3{left:50%; top:85%}

    /* мобільне перевизначення (за потреби) */
    @media (max-width:640px){
      .cta-spot{left:50%; top:80%}
      .cta-spot2{left:50%; top:86%}
      .cta-spot3{left:50%; top:92%}
    }

    .btn{display:inline-block;padding:14px 24px;font-size:18px;border-radius:999px;text-decoration:none;color:#fff;border:0;cursor:pointer;background:linear-gradient(180deg,#34d058,#21b03b);box-shadow:0 10px 24px rgba(52,208,88,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s,box-shadow .12s,filter .12s}
    .btn:hover{transform:translateY(-1px);filter:brightness(1.03);box-shadow:0 14px 30px rgba(52,208,88,.45),inset 0 1px 0 rgba(255,255,255,.3)}

    /* форма/системні */
    .form{max-width:560px;margin:24px auto;padding:24px;background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:16px}
    label{display:block;font-size:14px;color:var(--muted);margin:10px 0 6px}
    .input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#0f141c;color:var(--text);outline:none}
    .input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
    .center{display:flex;align-items:center;justify-content:center}
    .alert{margin:0 auto 16px;max-width:560px;padding:12px 14px;border-radius:12px;background:var(--okbg);border:1px solid var(--okbr);color:#b9f6c9}
    .alert.error{background:#371717;border-color:#6b2a2a;color:#ffc7c7}
    .footer{flex-shrink:0;color:#cbd3de;opacity:.6;font-size:14px;padding:24px 0;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="container">
      {% with msgs = get_flashed_messages(with_categories=true) %}
        {% if msgs %}
          {% for category, message in msgs %}
            <div class="alert {% if category=='error' %}error{% endif %}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </div>
  <div class="footer">2025 ARCOSS AIRNE. All rights reserved • Privacy Policy</div>
</body>
</html>
